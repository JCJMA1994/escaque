# Capturas de Play Store en teléfono y tablet, en español e inglés (manual).
# Requiere tablero_app/android/ en el repositorio (tablero_app/tool/bootstrap_android.py)
# con el google-services.json del flavor dev.
name: Capturas (Play Store)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet]
        lang: [es, en]
        include:
          - device: phone
            profile: pixel_7
          - device: tablet
            profile: pixel_tablet
    defaults: { run: { working-directory: tablero_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.7', cache: true }
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: flutter pub get && cp config/dev.json.example config/dev.json
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          working-directory: tablero_app
          script: >
            flutter drive --driver=test_driver/integration_test.dart
            --target=integration_test/screenshots_test.dart --flavor dev
            --dart-define-from-file=config/dev.json --dart-define=SCREENSHOTS=true
            --dart-define=SHOT_LANG=${{ matrix.lang }} --dart-define=SHOT_DEVICE=${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ matrix.device }}-${{ matrix.lang }}
          path: tablero_app/build/screenshots

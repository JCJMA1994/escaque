# Test de integración de la app en un emulador Android.
# Manual y cada noche (es lento: arranca un emulador).
name: Integración (Android)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # 02:00 en Lima

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: tablero_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.7', cache: true }
      - name: Habilitar KVM (emulador acelerado)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: flutter pub get && cp config/dev.json.example config/dev.json
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: tablero_app
          script: flutter test integration_test --flavor dev --dart-define-from-file=config/dev.json
